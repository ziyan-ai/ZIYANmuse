[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-ziyanai"
version = "0.1.0"
description = "Reverse engineer any video: shot-level production-method forensics (live action / AI video / code render / mixed) and remake planning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<5",
  "Pillow>=9.0",
  "PyYAML>=6.0",
  "onnxruntime>=1.16",   # 人声/配乐分离（UVR MDX-Net，首次运行自动下载约 67 MB 模型）
]

[project.optional-dependencies]
# Python ≤ 3.12 用 rapidocr-onnxruntime；它没有 3.13 及以上的版本，那里改用 rapidocr 3.4.x。
# 3.5 及以上在回归字幕识别时漏检，先固定在最后验证通过的 3.4.5 系列。
# rapidocr-onnxruntime 会顺带装 opencv-python（带 GUI 的那套），和上面的 headless 抢同一个 cv2 目录；
# scripts/install_skill.sh 装完会删掉它、重装 headless。手动安装见 setup.md。rapidocr 3 本身就用 headless。
ocr = [
  "rapidocr-onnxruntime>=1.3,<2; python_version < '3.13'",
  "rapidocr>=3.4.5,<3.5; python_version >= '3.13'",
]
dev = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
rea-ziyanai = "rea_video.cli:main"
rea-video = "rea_video.cli:main"

[tool.setuptools.packages.find]
include = ["rea_video*"]

[tool.setuptools.package-data]
rea_video = ["capabilities/*.yaml", "capabilities/*.json", "capabilities/*.md", "capabilities/models/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
