  - id: kling-4.0
    name: Kling 4.0（可灵 4.0，含 Flash）
    vendor: Kuaishou
    category: video
    release: 2026-10
    status: preview
    access: [app, api, api-aggregator]
    primitives: [video.t2v, video.i2v_first_frame, video.i2v_first_last, video.keyframes, video.multi_reference, video.reference_video, video.edit_v2v, video.camera_control, video.native_audio]
    limits:
      duration_s: {min: 3, max: 30}
      resolutions: [720p, 1080p, 4K]
      refs: {image: 10, video: 5, audio: 1, total: 15}
      prompt_tokens: 8000
      keyframes: 10
    audio: {native: true, voice_ref: true}
    strengths:
      - 首尾帧 + 最多 10 张关键帧，复杂运镜和中间状态可控
      - Omni Reference 最多 15 个参考（10 图、5 段视频合计 30 秒、7 个 element）
      - 视频编辑：表情、肢体、机位、风格、背景、角色均可改（最多 5 段输入、合计 30 秒）
      - 立体声，多语种对白与口音；屏幕文字支持多语种和 emoji
      - 画幅 21:9 / 16:9 / 1:1 / 9:16
    weaknesses:
      - Flash 版 3–20 秒、仅 720p、8-bit SDR；10-bit HDR 与续写（最长 2 分钟）为 coming soon
      - 音频参考只能当声音参考
    license: {commercial: true, note: 以平台条款为准}
    sources:
      - https://fal.ai/learn/tools/what-is-kling-4-0
    verified: {date: 2026-10-29, basis: third-party}
    confidence: medium
    notes: Flash 于 2026-09-28 开放有限早期访问；正式版预计 2026-10 上线，需上线后复核

