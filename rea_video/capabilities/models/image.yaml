# 图像模型（关键帧 / 首帧 / 分镜 / 画内文字）

models:
  - id: gpt-image-2.5
    name: GPT Image 2.5
    vendor: OpenAI
    category: image
    release: 2026-08
    status: ga
    access: [api, app, api-aggregator]
    primitives: [image.t2i, image.edit_multi_ref, image.text_render]
    strengths:
      - "【用户实测】中文字体效果最好、真实感最高，是中文画内文字和写实首帧的首选"
      - 指令遵循稳定；可输出透明背景（PNG/WebP）；质量档位可到 xhigh 和 max
    weaknesses:
      - 价格与速度取决于质量档位
    license: {commercial: true}
    sources:
      - https://www.eachlabs.ai/blog/best-ai-image-generation-models-2026
    verified: {date: 2026-10-29, basis: user}
    confidence: high
    notes: 发布月份为估计值；Hypit 目前接入的是 GPT Image 2（通过 HypiHub，2K/4K 部分画幅不可用）

  - id: nano-banana-2.1
    name: Nano Banana 2.1
    vendor: Google
    category: image
    release: 2026-08
    status: ga
    access: [api, app, api-aggregator]
    primitives: [image.t2i, image.edit_multi_ref, image.text_render]
    limits:
