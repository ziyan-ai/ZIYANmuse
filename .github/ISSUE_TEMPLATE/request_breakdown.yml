name: 求拆解 / Request a breakdown
description: 有条视频想知道是怎么做的？贴链接并说明想了解什么。/ Want to know how a video was made? Share the link and tell us what you want to learn.
title: "[求拆解] "
labels: ["求拆解"]
body:
  - type: input
    id: link
    attributes:
      label: 视频链接 / Video link
      description: 抖音、B 站、小红书、YouTube、TikTok 都行。没有链接就说明怎么找到它。/ Douyin, Bilibili, Xiaohongshu, YouTube, TikTok all work. No link? Tell us how to find it.
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: want
    attributes:
      label: 最想知道什么 / What do you most want to know
      multiple: true
      options:
        - 是实拍、AI 还是代码做的 / Live action, AI or code-rendered
        - 实拍怎么拍（机位、布光、调色）/ How the live footage was shot (camera, lighting, grading)
        - AI 镜头的提示词和用哪个模型 / Prompts and models for the AI shots
        - 字幕、花字、剪辑节奏 / Captions, text effects and editing rhythm
        - 配乐和音效是怎么来的 / Where the music and sound effects came from
        - 整条怎么复刻、要花多少钱 / How to remake it and what it costs
    validations:
      required: true
  - type: textarea
    id: guess
    attributes:
      label: 你自己的判断 / Your own take
      description: 可不填。你觉得它是怎么做的、哪里看不出来，写下来方便对照。/ Optional. How you think it was made and what you can't tell, so we can compare.
