# 两篇 OiiOii 公众号文章里的视频（微信转码版：30fps、二次压缩、元数据带 "Tencent CAPD MTS"）
# 来源：mp.weixin.qq.com/s/s7i_fQmwWo9SbRoV-KDZ9g（a1）、mp.weixin.qq.com/s/aXhPx0eQu9ngYxuyvsFE4Q（a2）
# 视频文件不进仓库：放在 eval/media/articles/v01.mp4 … v13.mp4（编号对照见同目录 mapping.tsv）
# 真值 = 文章作者对制作方式的说明 + 人工看画面；v02、v05、v06 真值不确定，不列入
# 注意：v0.3 的转码/3D 规则是看过这批视频后加的，属于开发集，不是留出集
# cuts：逐个看候选切点前后帧标出的切点真值（含跳剪、推近切、几帧的短镜头；闪光、火光、局部叠图不算）；cuts_uncertain 是看不准的位置，检测到也不算错
videos:
  - id: art_v01_oiioii_remake          # a1 复刻成片：视频模型 + Harness
    path: eval/media/articles/v01.mp4
    label: ai_video
  - id: art_v03_pure_model_remake      # a1 直接用视频模型复刻（含 AI 生成的铅笔素描过渡、结尾拉远）
    path: eval/media/articles/v03.mp4
    label: ai_video
  - id: art_v04_promo_original         # a1 别人的产品推广片：玻璃质感 3D 元素 + 文字动效
    path: eval/media/articles/v04.mp4
    label: [cg_3d, code_render]
  - id: art_v07_male_swap              # a1 换成男生版
    path: eval/media/articles/v07.mp4
    label: ai_video
  - id: art_v08_side_by_side           # a2 「广告原始 / 广告复刻后」左右拼屏，两边都是 UI 动效
    path: eval/media/articles/v08.mp4
    label: [code_render, screen_capture]
  - id: art_v09_gemini_original        # a2 Google Gemini 发布片：2D UI 动效
    path: eval/media/articles/v09.mp4
    label: [code_render, screen_capture]
  - id: art_v10_oiioii_gen_coding      # a2 OiiOii 第一版「视频生成 + Coding」：代码 UI 动效为主
    path: eval/media/articles/v10.mp4
    label: [code_render, screen_capture, still_motion]
  - id: art_v11_tiktok_original        # a2 TikTok 带货原片：手机实拍（真实厨房、真手、男声口播）
    aspects: {format: {format: product}}   # 目测 2026-10-30：第一视角手持，手拿食材放进榨汁杯，无人脸
    path: eval/media/articles/v11.mp4
    cuts: [0.73, 1.50, 2.20, 4.03, 5.77, 6.53, 7.23, 8.73, 12.97, 14.60, 18.67, 19.03]
    cuts_uncertain: [3.27, 20.67]
    label: live_action
    real_material: true
  - id: art_v12_juicer_remake          # a2 OiiOii 榨汁杯复刻（带 AIGC 隐式标识）
    path: eval/media/articles/v12.mp4
    label: ai_video
  - id: art_v13_outfit_swap            # a2 变装换人物（QQ 飞车风，游戏 UI 是画进画面的）
    path: eval/media/articles/v13.mp4
    label: ai_video
